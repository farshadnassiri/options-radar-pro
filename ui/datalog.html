<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جریان داده — رصد استراتژی آپشن</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="/ui/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b6e6b'/%3E%3Cpath d='M4 5h6M4 8h8M4 11h4' stroke='%23fff' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<!-- R5-23: تبِ «جریان داده» در پنجرهٔ جدا.
     پنجرهٔ اصلی هنگامِ جابه‌جاییِ تب، تبِ قبلی را کامل می‌بندد (حلقه‌ها و
     زمان‌سنج‌هایش هم با آن). این صفحه مستقل است: فقط `/api/datalog` را
     می‌خواند و هر چند ثانیه تازه می‌شود، پس کنارِ کار در پنجرهٔ اصلی زنده
     می‌ماند. پوششِ `fetch` اینجا نصب نمی‌شود — خواندنِ لاگ خودش لاگ نمی‌شود. -->
<body data-theme="board" class="dl-standalone">
  <main class="stage" id="stage"></main>
  <script type="module">
    try { document.body.dataset.theme = localStorage.getItem('theme') || 'board'; } catch { /* حافظهٔ بسته */ }
    const { mount } = await import('/ui/tabs/datalog.mjs');
    await mount(document.getElementById('stage'), { standalone: true });
  </script>
</body>
</html>
